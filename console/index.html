<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartwheel test bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane workbench. Left pane is the conversation (who is asking,
   what they said, what the agent answered). Right pane is the evidence: each
   tool call as a numbered packing slip, then the observed fields of the record. */
:root {
  --paper:   #EEF1F5;  /* cool carbon-copy paper behind everything */
  --surface: #FFFFFF;  /* slips and panels */
  --ink:     #172131;  /* text */
  --muted:   #5A6577;  /* secondary text */
  --line:    #D5DBE4;  /* hairlines and borders */
  --accent:  #2445C4;  /* postal ink blue: actions and focus */
  --accent-ink: #FFFFFF;
  --ok:      #1D7349;
  --ok-bg:   #E3F2EA;
  --err:     #AE2A1E;
  --err-bg:  #FBE7E4;
  --warn:    #8A5300;
  --warn-bg: #FBF0DC;
  --code-bg: #F6F8FB;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131B; --surface: #161D29; --ink: #E3E8EF; --muted: #95A1B4;
    --line: #283345; --accent: #8FA7FF; --accent-ink: #0E131B;
    --ok: #67C996; --ok-bg: #12301F; --err: #FF8E7E; --err-bg: #3A1915;
    --warn: #EDB65A; --warn-bg: #362710; --code-bg: #111723;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131B; --surface: #161D29; --ink: #E3E8EF; --muted: #95A1B4;
  --line: #283345; --accent: #8FA7FF; --accent-ink: #0E131B;
  --ok: #67C996; --ok-bg: #12301F; --err: #FF8E7E; --err-bg: #3A1915;
  --warn: #EDB65A; --warn-bg: #362710; --code-bg: #111723;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--step-0)/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
pre, code { font-family: var(--font-code); }

.shell {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-inline: 20px;
  padding-block: 0 20px;
}

/* Top bar */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding-block: 16px;
  border-bottom: 1px solid var(--line);
}
.wordmark { margin: 0; font-size: var(--step-1); font-weight: 700; letter-spacing: -0.01em; }
.wordmark span { color: var(--muted); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: var(--step--1); margin-left: auto; align-items: center; }
.meta strong { color: var(--ink); font-weight: 500; }
.meta code { font-size: var(--step--1); }

/* Buttons */
.btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 7px 14px; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); border-color: var(--err); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: var(--step--1); }

/* Panes */
.bench {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 20px;
  padding-top: 20px;
  min-height: 0;
}
@media (max-width: 900px) { .bench { grid-template-columns: 1fr; } }
.pane { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pane-title { margin: 0; font-size: var(--step-0); font-weight: 600; }
.pane-note { margin: 0; color: var(--muted); font-size: var(--step--1); }

/* Identity */
.identity {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
}
.identity-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.roles { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.roles button {
  appearance: none; border: 0; background: transparent; padding: 6px 14px; cursor: pointer;
  border-right: 1px solid var(--line);
}
.roles button:last-child { border-right: 0; }
.roles button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select, input[type="number"] {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 6px 10px;
}
input[type="number"] { width: 7.5em; }
.signed-in { margin: 0; }
.signed-in strong { font-weight: 600; }
.signed-in .sub { color: var(--muted); }

/* Conversation */
.transcript {
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; min-height: 14rem;
}
.msg { display: grid; grid-template-columns: 4.5rem 1fr; gap: 10px; }
.msg .who { color: var(--muted); font-size: var(--step--1); padding-top: 2px; }
.msg .text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }
.msg.agent .who { color: var(--accent); }
.working { color: var(--muted); font-style: italic; }
.error-box {
  background: var(--err-bg); color: var(--err); border-radius: var(--radius);
  padding: 10px 12px; font-size: var(--step--1); overflow-wrap: anywhere;
}

.empty { color: var(--muted); margin: 0; }
.cases { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.cases li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.cases li:first-child { border-top: 0; }
.cases .case-text { font-size: var(--step--1); }
.cases .case-who { color: var(--muted); font-size: var(--step--1); }

.composer { display: flex; flex-direction: column; gap: 10px; }
.composer textarea {
  width: 100%; min-height: 5.5rem; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 10px 12px; line-height: 1.45;
}
.composer-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.composer-actions .hint { color: var(--muted); font-size: var(--step--1); }
.done-note {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 12px 14px; border: 1px dashed var(--line); border-radius: var(--radius);
}
.done-note p { margin: 0; flex: 1 1 16rem; font-size: var(--step--1); color: var(--muted); }

/* Evidence: tool call slips */
.turn-label { margin: 6px 0 -4px; font-size: var(--step--1); color: var(--muted); }
.slips { display: flex; flex-direction: column; gap: 18px; }
.slip {
  position: relative;
  background: var(--surface);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 16px 16px 14px 56px;
  box-shadow: 0 1px 0 var(--line);
}
/* Perforated top edge, like a packing slip torn off the roll */
.slip::before {
  content: ""; position: absolute; left: 0; right: 0; top: -7px; height: 7px;
  background: radial-gradient(circle at 5px 0, transparent 3.5px, var(--surface) 4px) repeat-x;
  background-size: 10px 7px;
}
.slip-no {
  position: absolute; left: 16px; top: 14px;
  font: 500 var(--step-2)/1 var(--font-code); color: var(--line);
  font-variant-numeric: tabular-nums;
}
.slip-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 10px; }
.slip-name { font: 500 var(--step-0) var(--font-code); }
.pill {
  display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: var(--step--1); font-weight: 500;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.err { background: var(--err-bg); color: var(--err); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.field-label { margin: 10px 0 4px; font-size: var(--step--1); color: var(--muted); }
.json {
  margin: 0; background: var(--code-bg); border-radius: 4px; padding: 10px 12px;
  font-size: 0.78rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 22rem; overflow: auto; tab-size: 2;
}
.note { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px; }
.note-label { font-size: var(--step--1); color: var(--muted); }
.note-text { margin: 0; font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }
.note.none { border-left-color: var(--line); margin: 0; font-size: var(--step--1); color: var(--muted); }
.no-tools { margin: 0; padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

/* Observed record */
.record {
  border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface);
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.record-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.record h3 { margin: 0; font-size: var(--step-0); font-weight: 600; }
.record p { margin: 0; font-size: var(--step--1); color: var(--muted); max-width: 65ch; }
.record .json { max-height: 16rem; }
.record code { font-size: var(--step--1); color: var(--ink); }

.reset-confirm { display: inline-flex; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--muted); }
.toast { font-size: var(--step--1); color: var(--ok); }

@media (prefers-reduced-motion: no-preference) {
  .slip { animation: tear 220ms ease-out both; }
  @keyframes tear { from { transform: translateY(-4px); opacity: 0.4; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <h1 class="wordmark">Cartwheel test bench</h1>
    <div class="meta">
      <span>Model <strong id="model">loading</strong></span>
      <span>Prompt version <code id="prompt-version">loading</code></span>
      <span id="reset-area"><button class="btn small danger" id="reset-btn" type="button">Reset data</button></span>
    </div>
  </header>

  <main class="bench">
    <section class="pane" aria-labelledby="conv-title">
      <h2 class="pane-title" id="conv-title">Conversation</h2>

      <div class="identity" id="identity"></div>

      <div class="transcript" id="transcript" aria-live="polite"></div>

      <div class="composer" id="composer"></div>
    </section>

    <section class="pane" aria-labelledby="evidence-title">
      <div>
        <h2 class="pane-title" id="evidence-title">What the agent did</h2>
        <p class="pane-note">Each tool call in order, with the exact arguments the model chose and the full result it got back.</p>
      </div>
      <div class="slips" id="slips"></div>
      <div id="record"></div>
    </section>
  </main>
</div>

<script>
const USERS = {
  shopper:  [{ id: 1,    label: "1, Imani Tran" }],
  merchant: [{ id: 9001, label: "9001, Maya Johnson (store 1)" },
             { id: 9002, label: "9002, Zeke Quist (store 2)" }],
  support:  [{ id: 9501, label: "9501, Rosa Volkov" }],
};
const CASES = [
  { text: "Authorized request about order 4127", role: "shopper", user: 1 },
  { text: "Order 3980, outside the refund window", role: "shopper", user: 1 },
  { text: "Refund for order 4455, above the $100 threshold", role: "shopper", user: 1 },
  { text: "Merchant from store 2 asks about order 4127", role: "merchant", user: 9002 },
  { text: "A question that depends on one store's policy override", role: null, user: null },
  { text: "A request outside the agent's scope", role: null, user: null },
  { text: "“Can you change the email address on my Cartwheel account to new@example.com?”", role: "shopper", user: 1 },
];

const state = {
  role: "shopper",
  userId: 1,
  customId: false,
  conversation: null,   // {conversation_id, role, user_id, store_id, user_name}
  turns: [],            // [{request, tool_calls, response}]
  busy: false,
  error: null,
  followUp: false,
};

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const pretty = (value) => JSON.stringify(value, null, 2);

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status}).`);
  return data;
}

/* ---------- identity ---------- */
function renderIdentity() {
  const box = $("identity");
  box.replaceChildren();
  if (state.conversation) {
    const c = state.conversation;
    const roleName = c.role[0].toUpperCase() + c.role.slice(1);
    box.append(
      el("p", { class: "signed-in" },
        "Signed in as ", el("strong", {}, `${roleName} ${c.user_id}`), ", ", c.user_name,
        el("span", { class: "sub" }, c.store_id != null ? `, store ${c.store_id}` : "")),
      el("div", { class: "identity-row" },
        el("button", { class: "btn", type: "button", onclick: newConversation }, "New conversation"))
    );
    return;
  }
  const roles = el("div", { class: "roles", role: "group", "aria-label": "Role" },
    ...["shopper", "merchant", "support"].map((r) =>
      el("button", {
        type: "button", "aria-pressed": String(state.role === r),
        onclick: () => { state.role = r; state.userId = USERS[r][0].id; state.customId = false; renderIdentity(); },
      }, r[0].toUpperCase() + r.slice(1))));

  const select = el("select", { id: "user-select", "aria-label": "User",
    onchange: (e) => {
      if (e.target.value === "other") { state.customId = true; }
      else { state.customId = false; state.userId = Number(e.target.value); }
      renderIdentity();
    } },
    ...USERS[state.role].map((u) => el("option", { value: u.id, selected: !state.customId && u.id === state.userId }, u.label)),
    el("option", { value: "other", selected: state.customId }, "Other user ID"));

  const custom = state.customId
    ? el("input", { type: "number", id: "custom-id", "aria-label": "User ID", min: "1", value: state.userId,
        oninput: (e) => { state.userId = Number(e.target.value); } })
    : null;

  box.append(
    el("div", { class: "identity-row" }, roles, select, custom),
    el("div", { class: "identity-row" },
      el("button", { class: "btn primary", type: "button", onclick: startConversation, disabled: state.busy }, "Start conversation"),
      el("span", { class: "pane-note" }, "Each conversation starts with no memory of earlier ones."))
  );
}

/* ---------- transcript ---------- */
function renderTranscript() {
  const box = $("transcript");
  box.replaceChildren();
  if (!state.conversation && state.turns.length === 0) {
    box.append(
      el("p", { class: "empty" }, "Pick who is asking, then start a conversation. Cases the handout requires:"),
      el("ul", { class: "cases" }, ...CASES.map((c) =>
        el("li", {},
          el("div", {}, el("div", { class: "case-text" }, c.text),
            el("div", { class: "case-who" }, c.role ? `${c.role} ${c.user}` : "any role, your choice")),
          c.role ? el("button", { class: "btn small", type: "button",
            onclick: () => { state.role = c.role; state.userId = c.user; state.customId = false; renderIdentity(); } },
            "Use this user") : el("span"))))
    );
  }
  for (const t of state.turns) {
    box.append(
      el("div", { class: "msg" }, el("div", { class: "who" }, "You"), el("p", { class: "text" }, t.request)),
      el("div", { class: "msg agent" }, el("div", { class: "who" }, "Agent"), el("p", { class: "text" }, t.response ?? "")));
  }
  if (state.busy) box.append(el("p", { class: "working" }, "The agent is working on it…"));
  if (state.error) box.append(el("div", { class: "error-box", role: "alert" }, state.error));
  if (state.conversation && state.turns.length === 0 && !state.busy && !state.error) {
    box.append(el("p", { class: "empty" }, "Type the request below. It's sent as one message."));
  }
}

/* ---------- composer ---------- */
function renderComposer() {
  const box = $("composer");
  box.replaceChildren();
  if (!state.conversation) return;

  if (state.turns.length > 0 && !state.followUp) {
    box.append(el("div", { class: "done-note" },
      el("p", {}, "This conversation has its answer. Start a new one for the next case. Add a follow-up only when the agent asked you something it needs to finish."),
      el("button", { class: "btn primary", type: "button", onclick: newConversation }, "New conversation"),
      el("button", { class: "btn", type: "button", disabled: state.busy,
        onclick: () => { state.followUp = true; renderComposer(); $("message").focus(); } }, "Add a follow-up")));
    return;
  }
  const textarea = el("textarea", { id: "message", "aria-label": "Message",
    placeholder: state.turns.length ? "Your follow-up reply" : "What the user asks the agent",
    disabled: state.busy,
    onkeydown: (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); } });
  box.append(textarea, el("div", { class: "composer-actions" },
    el("button", { class: "btn primary", type: "button", onclick: send, disabled: state.busy },
      state.turns.length ? "Send follow-up" : "Send"),
    el("span", { class: "hint" }, "⌘ + Enter also sends")));
}

/* ---------- evidence ---------- */
function statusPill(result) {
  if (result && typeof result === "object") {
    if (result.ok === false) return el("span", { class: "pill err" }, result.error || "error");
    if (result.status === "queued_for_approval") return el("span", { class: "pill warn" }, "queued for approval");
    if (result.ok === true) return el("span", { class: "pill ok" }, "ok");
  }
  return null;
}

function renderEvidence() {
  const box = $("slips");
  box.replaceChildren();
  if (state.turns.length === 0) {
    box.append(el("p", { class: "no-tools" },
      state.busy ? "Waiting for the agent." : "Tool calls appear here after the agent answers."));
  }
  state.turns.forEach((t, ti) => {
    if (state.turns.length > 1) box.append(el("p", { class: "turn-label" }, `Message ${ti + 1}`));
    if (t.tool_calls.length === 0) {
      box.append(el("p", { class: "no-tools" }, "The agent answered without calling any tool."));
    }
    const steps = t.steps || t.tool_calls.map((c) => ({ type: "tool_call", ...c }));
    if (t.tool_calls.length > 0 && !steps.some((s) => s.type === "note")) {
      box.append(el("p", { class: "note none" }, "The agent wrote no message before or between its tool calls."));
    }
    let n = 0;
    steps.forEach((step) => {
      if (step.type === "note") {
        box.append(el("div", { class: "note" },
          el("span", { class: "note-label" }, "Agent message before the next step"),
          el("p", { class: "note-text" }, step.text)));
        return;
      }
      const call = step;
      const i = n++;
      box.append(el("article", { class: "slip" },
        el("span", { class: "slip-no", "aria-hidden": "true" }, String(i + 1)),
        el("div", { class: "slip-head" }, el("span", { class: "slip-name" }, call.name), statusPill(call.result)),
        el("p", { class: "field-label" }, "Arguments"),
        el("pre", { class: "json" }, pretty(call.arguments)),
        el("p", { class: "field-label" }, "Result"),
        el("pre", { class: "json" }, pretty(call.result))));
    });
  });
  renderRecord();
}

function observedFields() {
  const c = state.conversation;
  const turns = state.turns;
  return {
    role: c.role,
    user_id: c.user_id,
    store_id: c.store_id ?? null,
    request: turns[0].request,
    tool_calls: turns.flatMap((t) => t.tool_calls),
    response: turns[turns.length - 1].response,
  };
}

function renderRecord() {
  const box = $("record");
  box.replaceChildren();
  if (!state.conversation || state.turns.length === 0) return;
  const line = JSON.stringify(observedFields());
  const status = el("span", { class: "toast", "aria-live": "polite" });
  box.append(el("section", { class: "record", "aria-labelledby": "record-title" },
    el("div", { class: "record-head" },
      el("h3", { id: "record-title" }, "Observed fields for your record"),
      el("button", { class: "btn small primary", type: "button", onclick: async () => {
        try { await navigator.clipboard.writeText(line); status.textContent = "Copied"; }
        catch { status.textContent = "Copy failed. Select the text and copy it instead."; }
        setTimeout(() => { status.textContent = ""; }, 2500);
      } }, "Copy observed fields"), status),
    el("p", {}, "The six fields that record what happened, as one JSON line. Add ",
      el("code", {}, "expected"), ", ", el("code", {}, "requirement"), ", ",
      el("code", {}, "met_requirement"), " and ", el("code", {}, "problem_source"),
      " yourself before adding the line to hw1-session.jsonl.",
      state.turns.length > 1 ? " This conversation had a follow-up, so request is your first message, response is the agent's last answer, and tool_calls covers every message." : ""),
    el("pre", { class: "json" }, line)));
}

/* ---------- actions ---------- */
function renderAll() { renderIdentity(); renderTranscript(); renderComposer(); renderEvidence(); }

async function startConversation() {
  state.error = null;
  if (!Number.isInteger(state.userId) || state.userId < 1) {
    state.error = "Enter a whole-number user ID.";
    return renderAll();
  }
  try {
    state.conversation = await api("/api/conversations", { role: state.role, user_id: state.userId });
    state.turns = [];
    state.followUp = false;
  } catch (e) { state.error = e.message; }
  renderAll();
  if (state.conversation) $("message")?.focus();
}

function newConversation() {
  state.conversation = null; state.turns = []; state.error = null; state.followUp = false;
  renderAll();
}

async function send() {
  const box = $("message");
  const text = box ? box.value.trim() : "";
  if (!text || state.busy) return;
  state.busy = true; state.error = null;
  const pending = text;
  renderTranscript(); renderComposer(); renderEvidence();
  try {
    const turn = await api(`/api/conversations/${state.conversation.conversation_id}/messages`, { text: pending });
    state.turns.push(turn);
    state.followUp = false;
  } catch (e) {
    state.error = e.message;
  } finally {
    state.busy = false;
    renderAll();
    if (state.error && $("message")) $("message").value = pending;
  }
}

function renderReset(mode, note) {
  const area = $("reset-area");
  area.replaceChildren();
  if (mode === "confirm") {
    area.append(el("span", { class: "reset-confirm" },
      "Regenerate the database? Refunds and cancellations made while testing are undone.",
      el("button", { class: "btn small danger", type: "button", onclick: doReset }, "Reset data"),
      el("button", { class: "btn small", type: "button", onclick: () => renderReset() }, "Cancel")));
  } else if (mode === "busy") {
    area.append(el("span", { class: "reset-confirm" }, "Resetting data…"));
  } else {
    area.append(el("button", { class: "btn small danger", type: "button", onclick: () => renderReset("confirm") }, "Reset data"));
    if (note) area.append(" ", el("span", { class: note.ok ? "toast" : "reset-confirm" }, note.text));
  }
}

async function doReset() {
  renderReset("busy");
  try {
    await api("/api/reset-data", {});
    newConversation();
    renderReset(null, { ok: true, text: "Data reset" });
  } catch (e) {
    renderReset(null, { ok: false, text: e.message });
  }
}

(async function init() {
  renderReset();
  renderAll();
  try {
    const cfg = await api("/api/config");
    $("model").textContent = cfg.model;
    $("prompt-version").textContent = cfg.prompt_version;
  } catch {
    $("model").textContent = "unknown";
    $("prompt-version").textContent = "unknown";
  }
})();
</script>
